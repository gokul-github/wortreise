name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - staging

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Skip on dependabot PRs (no access to secrets)
    if: github.actor != 'dependabot[bot]'
    # Do not require a protected GitHub environment; none is configured for this repo.
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:unit && npm run test:integration

      - name: Typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build
        env:
          VITE_AUTH_ENABLED: ${{ secrets.VITE_AUTH_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROK_AUTH_ISSUER: ${{ secrets.GROK_AUTH_ISSUER }}
          GROK_PROJECT_ID: ${{ secrets.GROK_PROJECT_ID }}

      - name: Check Vercel token
        id: vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "VERCEL_TOKEN is not set — skipping production deploy."
          fi

      - name: Deploy to Vercel Production
        uses: amondnet/vercel-action@v25
        if: steps.vercel.outputs.enabled == 'true'
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod=true"
        env:
          VITE_AUTH_ENABLED: ${{ secrets.VITE_AUTH_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROK_AUTH_ISSUER: ${{ secrets.GROK_AUTH_ISSUER }}
          GROK_PROJECT_ID: ${{ secrets.GROK_PROJECT_ID }}

      - name: Create deployment record
        uses: actions/github-script@v7
        if: steps.vercel.outputs.enabled == 'true'
        with:
          script: |
            const environment = "${{ github.event.inputs.environment }}" || "production";
            await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment,
              description: "Deployed via GitHub Actions",
              auto_merge: false,
              required_contexts: []
            });
