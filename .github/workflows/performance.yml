name: Performance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    # Skip on dependabot PRs
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          NODE_ENV: production

      - name: Wait for server
        run: sleep 10 && curl -f http://localhost:4173/

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4173/
            http://localhost:4173/play/quiz
            http://localhost:4173/words
            http://localhost:4173/pass
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  bundle-size:
    name: Bundle Size
    runs-on: ubuntu-latest
    # Skip on dependabot PRs
    if: github.actor != 'dependabot[bot]'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Check bundle size
        run: |
          echo "## Bundle Size Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| File | Size | Gzipped |" >> $GITHUB_STEP_SUMMARY
          echo "|------|------|---------|" >> $GITHUB_STEP_SUMMARY
          for file in dist/client/assets/*.js dist/client/assets/*.css; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              gzipped=$(gzip -c "$file" | wc -c)
              echo "| $(basename "$file") | $(numfmt --to=iec $size) | $(numfmt --to=iec $gzipped) |" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Fail if bundle too large
        run: |
          MAX_JS=500000  # 500KB
          MAX_CSS=100000 # 100KB
          
          for file in dist/client/assets/*.js; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ $size -gt $MAX_JS ]; then
                echo "❌ JavaScript bundle too large: $(basename "$file") ($(numfmt --to=iec $size))"
                exit 1
              fi
            fi
          done
          
          for file in dist/client/assets/*.css; do
            if [ -f "$file" ]; then
              size=$(wc -c < "$file")
              if [ $size -gt $MAX_CSS ]; then
                echo "❌ CSS bundle too large: $(basename "$file") ($(numfmt --to=iec $size))"
                exit 1
              fi
            fi
          done
          
          echo "✅ All bundles within size limits"