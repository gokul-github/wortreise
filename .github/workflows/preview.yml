name: Deploy Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  deploy-preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_AUTH_ENABLED: ${{ secrets.VITE_AUTH_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROK_AUTH_ISSUER: ${{ secrets.GROK_AUTH_ISSUER }}
          GROK_PROJECT_ID: ${{ secrets.GROK_PROJECT_ID }}

      - name: Deploy to Vercel Preview
        uses: amondnet/vercel-action@v25
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod=false'
        env:
          VITE_AUTH_ENABLED: ${{ secrets.VITE_AUTH_ENABLED }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GROK_AUTH_ISSUER: ${{ secrets.GROK_AUTH_ISSUER }}
          GROK_PROJECT_ID: ${{ secrets.GROK_PROJECT_ID }}

      - name: Comment PR with preview URL
        if: ${{ secrets.VERCEL_TOKEN != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number
            });
            const botComment = comments.find(c => c.user.type === 'Bot' && c.body.includes('Preview deployment'));
            const previewUrl = '${{ steps.vercel.outputs.preview-url }}';
            const body = `🚀 **Preview deployment ready!**\n\n[View Preview](${previewUrl})`;
            
            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                body
              });
            }