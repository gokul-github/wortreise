name: Android test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "scripts/check-android-bundle.mjs"
      - "capacitor.config.ts"
      - "vite.android.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "scripts/check-android-bundle.mjs"
      - "capacitor.config.ts"
      - "vite.android.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-test.yml"
  workflow_dispatch:

jobs:
  test:
    name: Web tests and Android unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run web unit tests
        run: npm test

      - name: Build Android bundle and run JVM unit tests
        run: npm run test:android
