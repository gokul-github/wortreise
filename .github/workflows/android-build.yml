name: Android build

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "capacitor.config.ts"
      - "vite.android.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  pull_request:
    paths:
      - "src/**"
      - "android/**"
      - "public/**"
      - "capacitor.config.ts"
      - "vite.android.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/android-build.yml"
  workflow_dispatch:

jobs:
  debug-apk:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK packages
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Install npm dependencies
        run: npm ci

      - name: Build web bundle and sync Capacitor
        run: npm run build:android

      - name: Check web bundle
        run: node scripts/check-android-bundle.mjs

      - name: Assemble debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wortreise-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
