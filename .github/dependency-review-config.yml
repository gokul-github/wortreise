# Dependency Review Configuration
# https://github.com/actions/dependency-review-action

# Fail on vulnerabilities of this severity or higher
# Options: low, moderate, high, critical
fail-on-severity: high

# Allow specific vulnerabilities (by GHSA ID)
# allow-ghsas:
#   - GHSA-xxxx-xxxx-xxxx

# License policies
# Deny licenses that are not in this list
# allow-licenses:
#   - MIT
#   - Apache-2.0
#   - BSD-2-Clause
#   - BSD-3-Clause
#   - ISC
#   - CC0-1.0
#   - Unlicense

# Deny specific licenses
deny-licenses:
  - GPL-3.0
  - AGPL-3.0
  - SSPL-1.0

# Scope of dependency review
# Options: runtime, development, all
scope: all

# Configuration file for custom rules (optional)
# config-file: '.github/dependency-review-config.yml'
